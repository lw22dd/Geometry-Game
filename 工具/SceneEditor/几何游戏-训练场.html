<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON ASCENT · 霓虹攀升 · 地图编辑器</title>
<style>
 html,body{margin:0;height:100%;background:#05030f;overflow:hidden;display:flex;align-items:center;justify-content:center}
 canvas{border-radius:6px;box-shadow:0 0 70px rgba(100,70,255,.28)}
 #exportBtn{position:fixed;top:16px;right:16px;z-index:10;padding:8px 18px;font:600 14px Arial;background:rgba(100,70,255,.3);color:#c0d8ff;border:1px solid rgba(140,170,255,.5);border-radius:6px;cursor:pointer;transition:.2s}
 #exportBtn:hover{background:rgba(100,70,255,.55);color:#fff;border-color:#8ff6ff}

 #exportPanel h2{color:#c0d8ff;font:600 16px Arial;margin:0 0 6px 0}

 #exportPanel .closeBtn:hover{color:#c0d8ff;border-color:rgba(140,170,255,.35)}

<body>
<canvas id="c"></canvas>
<button id="exportBtn" onclick="showExport()">📋 导出地图 · Export Map</button>
<div id="exportOverlay" onclick="if(event.target===this)hideExport()">
<div id="exportPanel">
<h2>📋 地图描述符 · MapDefinition</h2>
<p>将此代码粘贴到 <code>config/level.ts</code> 的 <code>maps[]</code> 数组中，即可新增一张地图。
格式与项目中的 <code>MapDefinition</code> 接口完全一致。</p>
<textarea id="exportCode" readonly></textarea>
<div class="actions">
<button class="closeBtn" onclick="hideExport()">关闭</button>
<button class="copyBtn" onclick="copyExport()">📋 复制代码</button>
</div>

<script>
'use strict';
/* ================= 基础 ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const VW=1280,VH=720,PPM=34;
let DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=VW*DPR;cv.height=VH*DPR;
 const s=Math.min(innerWidth/VW,innerHeight/VH)*.98;cv.style.width=VW*s+'px';cv.style.height=VH*s+'px';}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);}

/* ============ 双物理模式（P 键切换，致敬 NEON DASH）============ */
const RUN=7,SPRINT=12,JUMP_H=3.2,TLIFE=.5,MAP_W=240,MAP_H=72;
const PHYS={
 tuned  :{G:28,JV:Math.sqrt(2*28*JUMP_H),MF:32,coy:.12,jb:.14,air:45,name:'优化'},
 classic:{G:10,JV:Math.sqrt(2*10*JUMP_H),MF:18,coy:0,  jb:.02,air:25,name:'经典 g=10'}
};
let mode='tuned';

/* ================= 关卡 · 240 × 72 八章节 ================= */
const R=(x,y,w,h)=>({x,y,w,h,top:y+h});
const solids=[
 // 一 · 霓虹平原
 R(0,0,58,4), R(38,4,4,1.2),
 R(59.5,5.2,3,.8),
 // 二 · 阶梯塔
 R(64,0,24,4),
 R(68,4,3.5,2),R(73,4,3.5,4),R(78,4,3.5,6.5),R(83,4,4,8),R(87,11.2,5,.8),
 // 三 · 尖刺谷高空走廊
 R(92,0,34,4),
 R(93,11.6,3.5,.8),R(99,11.2,3,.8),R(104.5,11.6,3,.8),R(109,12,3,.8),R(113.5,11.4,3.5,.8),R(118,12,6,1),
 // 四 · 攀升塔
 R(126,14.6,2.5,.7),R(131,16.8,2.5,.7),R(126,19,2.5,.7),R(131,21.2,2.5,.7),
 R(126,23.4,2.5,.7),R(131,25.6,2.5,.7),R(126,27.8,2.5,.7),R(131,29.4,12,1),
 // 五/六 · 移动平台 + 激光走廊
 R(166,28.8,40,1),
 // 七 · 冲刺天梯
 R(214,29.2,3,.8),R(224,30.6,3,.8),R(234,32,3,.8),R(228,34.2,3,.8),R(234,36.4,4,.9),
 // 八 · 终章
 R(236,38.8,3.5,.8),R(231,41,3,.8),R(232,43.2,7,1)
];
const movers=[
 {x0:145,x:145,dx:0,y:29.6,w:3,h:.8,range:4,spd:.8,ph:0},
 {x0:157,x:157,dx:0,y:29.2,w:3,h:.8,range:4,spd:.8,ph:Math.PI}
];
const spikes=[[24,4],[25,4],[26,4]].concat((()=>{const a=[];for(let x=94;x<=124;x++)a.push([x,4]);return a;})())
 .map(s=>({x:s[0],y:s[1]}));
const lasers=[{x:181,y0:29.8,len:6,ph:0},{x:188,y0:29.8,len:6,ph:.95},{x:195,y0:29.8,len:6,ph:1.9}];
const LCYC=2.6,LON=1.15;
const laserOn  =l=>((time+l.ph)%LCYC)<LON;
const laserWarn=l=>((time+l.ph)%LCYC)>LCYC-.3;
const orbs=[[12,5.4],[18,5.6],[25,6.2],[40,6.8],[48,5.4],
 [61,7.2],[69.8,7.4],[74.8,9.4],[79.8,11.9],[85,13.4],[89.5,13.4],
 [97.8,14],[103,13.6],[107.8,14.2],[111,14],[115.2,13.8],[121,15],
 [127.2,16.8],[132.2,19.3],[127.2,21.5],[132.2,24],[127.2,26.1],[132.2,28.3],[137,32],[142,31.6],
 [147.5,31.6],[152,31.2],[159.5,31],[169,31.4],
 [181,33],[184.5,31.4],[191.5,31.4],[198.5,31.4],
 [211,33.4],[215.5,31.6],[225.5,33],[235.5,34.6],[229.5,36.8],[237.7,40.6],
 [231.5,43.4],[238.5,41],[235,45.6]].map((o,i)=>({x:o[0],y:o[1],got:false,ph:i*1.7}));
const cps=[33,90,121,140,173,203,234].map((v,i)=>({x:v,y:[4,12,13,30.4,29.8,29.8,37.3][i],on:false}));
let cpPoint={x:6,y:4};
const NOVA={x:236.5,y:46.6};
const hints=[[8,6.4,'→ 出发'],[56,8.8,'深渊 · 浮岛'],[96,16.5,'尖刺谷 · 高空走廊'],[129,17.5,'攀 升 塔'],
 [147,33.4,'节奏平台'],[188,38.6,'激光栅栏 · 计时通过'],[209,34,'⚡ SHIFT 冲刺大跳 →'],[225,48.6,'登顶 · NOVA ★']];
const decos=[[24,13,1.1,.6],[34,18,.8,-.9],[60,22,.9,.8],[100,20,1.2,.5],[120,33,1,-.7],[150,36,1.2,.6],
 [180,40,1,-.5],[210,42,1.4,.4],[228,50,.9,-.6],[100,50,.8,.7]];

/* ================= 导出功能 ================= */
/**
 * 导出当前地图为 MapDefinition 格式（TypeScript）。
 * 输出可直接粘贴到项目 config/level.ts 的 maps[] 数组中。
 */
function generateMapExport() {
  const indent = '    '; // 4 空格缩进，与项目一致

  // 辅助：格式化数字，去尾零
  const fmtNum = (n) => {
    const s = n.toFixed(4);
    return parseFloat(s).toString();
  };

  // 辅助：生成 R(x, y, w, h) 调用行
  const fmtRect = (r) => `R(${fmtNum(r.x)}, ${fmtNum(r.y)}, ${fmtNum(r.w)}, ${fmtNum(r.h)})`;

  // ── 构建输出 ──
  let out = '';

  // 注释头
  out += `/**\n * 地图：当前地图名称\n * 尺寸：${MAP_W} × ${MAP_H}\n * 光球：${orbs.length} 枚\n * 检查点：${cps.length} 个\n */\n`;
  out += `{\n`;
  out += `${indent}id: 'my-new-map',\n`;
  out += `${indent}name: '新地图名称',\n`;
  out += `${indent}width: ${MAP_W},\n`;
  out += `${indent}height: ${MAP_H},\n`;
  out += `${indent}playerSpawn: { x: ${fmtNum(cpPoint.x)}, y: ${fmtNum(cpPoint.y)} },\n`;
  out += `\n`;

  // ── 静态几何 ──
  out += `${indent}// ── 静态几何 ├─\n`;
  out += `${indent}solids: [\n`;
  for (const r of solids) {
    out += `${indent}${indent}${fmtRect(r)},\n`;
  }
  out += `${indent}],\n\n`;

  out += `${indent}spikes: [\n`;
  for (const s of spikes) {
    out += `${indent}${indent}{ x: ${fmtNum(s.x)}, y: ${fmtNum(s.y)} },\n`;
  }
  out += `${indent}],\n\n`;

  out += `${indent}decos: [\n`;
  for (const d of decos) {
    out += `${indent}${indent}[${d.map(fmtNum).join(', ')}],\n`;
  }
  out += `${indent}],\n\n`;

  out += `${indent}hints: [\n`;
  for (const h of hints) {
    out += `${indent}${indent}[${fmtNum(h[0])}, ${fmtNum(h[1])}, '${h[2]}'],\n`;
  }
  out += `${indent}],\n\n`;

  // ── 实体生成描述 ──
  out += `${indent}// ── 实体生成描述 ├─\n`;
  out += `${indent}entitySpawners: {\n`;

  // movers
  out += `${indent}${indent}movers: [\n`;
  for (const m of movers) {
    out += `${indent}${indent}${indent}{ x0: ${fmtNum(m.x0)}, y: ${fmtNum(m.y)}, w: ${fmtNum(m.w)}, h: ${fmtNum(m.h)}, range: ${fmtNum(m.range)}, spd: ${fmtNum(m.spd)}, ph: ${m.ph === Math.PI ? 'Math.PI' : fmtNum(m.ph)} },\n`;
  }
  out += `${indent}${indent}],\n`;

  // lasers
  out += `${indent}${indent}lasers: [\n`;
  for (const l of lasers) {
    out += `${indent}${indent}${indent}{ x: ${fmtNum(l.x)}, y0: ${fmtNum(l.y0)}, len: ${fmtNum(l.len)}, ph: ${fmtNum(l.ph)} },\n`;
  }
  out += `${indent}${indent}],\n`;

  // orbs — 用原始坐标（from 原始数据外层数组）
  const orbCoords = orbs.map(o => [o.x, o.y]);
  out += `${indent}${indent}orbs: [\n`;
  for (const [ox, oy] of orbCoords) {
    out += `${indent}${indent}${indent}[${fmtNum(ox)}, ${fmtNum(oy)}],\n`;
  }
  out += `${indent}${indent}],\n`;

  // checkpoints — 从 cps 提取 x,y
  out += `${indent}${indent}checkpoints: [\n`;
  for (const c of cps) {
    out += `${indent}${indent}${indent}[${fmtNum(c.x)}, ${fmtNum(c.y)}],\n`;
  }
  out += `${indent}${indent}],\n`;

  // nova
  out += `${indent}${indent}nova: { x: ${fmtNum(NOVA.x)}, y: ${fmtNum(NOVA.y)} },\n`;

  out += `${indent}},\n`; // entitySpawners close
  out += `}`;

  return out;
}

function showExport() {
  const code = generateMapExport();
  document.getElementById('exportCode').value = code;
  document.getElementById('exportOverlay').classList.add('show');
}
function hideExport() {
  document.getElementById('exportOverlay').classList.remove('show');
}
function copyExport() {
  const ta = document.getElementById('exportCode');
  ta.select(); ta.setSelectionRange(0, 999999);
  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = document.querySelector('.copyBtn');
    const orig = btn.textContent;
    btn.textContent = '✅ 已复制！';
    setTimeout(() => btn.textContent = orig, 1500);
  }).catch(() => {});
}

/* ================= 状态 ================= */
const P={x:6,y:5,vx:0,vy:0,half:.42,grounded:false,coyote:0,jbuf:0,face:1,squash:0,dead:false,deadT:0,
 plat:null,sprint:false,wasSpr:false,inv:0};
let trail=[],particles=[];
let time=0,gt=0,gotN=0,deaths=0,win=false,winTime=0,started=false,introA=1,toast='',toastT=0,flash=0,shake=0;
const cam={x:12,y:12};let zoom=1;

/* ================= 输入（NEON DASH 按键）================= */
const keys={};
addEventListener('keydown',e=>{
 if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
 auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
 if(e.repeat)return;
 keys[e.code]=true;
 if(!started)started=true;
 if(e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp')P.jbuf=PHYS[mode].jb;
 if(e.code==='KeyR')respawn();
 if(e.code==='KeyP'){const o=PHYS[mode];mode=mode==='tuned'?'classic':'tuned';const n=PHYS[mode];
  P.vy*=n.JV/o.JV;toast='物理 · '+n.name;toastT=2;}
 if(e.code==='KeyM'){AU.on=!AU.on;toast=AU.on?'♪ 音效：开':'♪ 音效：关';toastT=2;
  if(AU.on&&AU.ctx)MUS.next=AU.ctx.currentTime+.05;}
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

/* ================= 音频 ================= */
const AU={ctx:null,on:true,master:null,noise:null};
function auInit(){if(AU.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();
 AU.master=AU.ctx.createGain();AU.master.gain.value=.4;AU.master.connect(AU.ctx.destination);
 const n=AU.ctx.sampleRate*.6|0,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.noise=b;MUS.next=AU.ctx.currentTime+.1;}catch(e){}}
function tone(tp,f0,f1,t,dur,vol,lp){if(!AU.ctx||!AU.on)return;const c=AU.ctx,o=c.createOscillator();o.type=tp;
 o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);
 let last=g;if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;g.connect(f);last=f;}
 last.connect(AU.master);o.start(t);o.stop(t+dur+.05);}
function nz(t,dur,vol,hp){if(!AU.ctx||!AU.on)return;const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;
 const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 const f=c.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=hp||900;
 s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+dur+.02);}
const now=()=>AU.ctx?AU.ctx.currentTime:0;
const sfx={
 jump(){tone('triangle',300,620,now(),.13,.14)},
 dash(){tone('sawtooth',220,80,now(),.28,.09,700);nz(now(),.25,.05,1400)},
 land(v){tone('triangle',150,70,now(),.07,Math.min(.16,v))},
 orb(){tone('triangle',880,880,now(),.08,.16);tone('triangle',1318.5,1318.5,now()+.07,.14,.14)},
 cp(){[523.25,659.25,783.99].forEach((f,i)=>tone('sine',f,f,now()+i*.05,.22,.11))},
 die(){tone('sawtooth',200,42,now(),.5,.2,800);nz(now(),.3,.12,500)},
 win(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone('triangle',f,f,now()+i*.09,.3,.13))}
};
const MUS={next:0,step:0,dt:60/128/4};
const BASS=[55,0,0,55,0,0,65.41,0,55,0,0,73.42,0,0,82.41,49];
function musicTick(){if(!AU.ctx||!AU.on)return;const c=AU.ctx;
 while(MUS.next<c.currentTime+.16){const s=MUS.step,t=MUS.next;
  if(s%4===0)tone('sine',150,40,t,.14,.4);
  if(s%4===2)nz(t,.04,.07,6500);
  if(BASS[s])tone('sawtooth',BASS[s],BASS[s],t,.15,.09,300);
  MUS.step=(s+1)%16;MUS.next+=MUS.dt;}}

/* ================= 粒子 ================= */
function part(o){particles.push(Object.assign({age:0,life:.6,vx:0,vy:0,grav:0,size:.12,col:'#8ff6ff',type:'dot',rot:0,vr:0},o));
 if(particles.length>420)particles.splice(0,particles.length-420);}
function burstDeath(x,y){for(let i=0;i<16;i++){const a=Math.random()*6.283,v=4+Math.random()*9;
 part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+3,grav:22,life:.7+Math.random()*.4,size:.14+Math.random()*.12,
 col:Math.random()<.5?'#7de8ff':'#c77dff',type:'frag',rot:Math.random()*3,vr:(Math.random()-.5)*14});}}
function dust(x,y,n){for(let i=0;i<n;i++)part({x:x+(Math.random()-.5)*.6,y,vx:(Math.random()-.5)*3,vy:Math.random()*2,grav:5,life:.35,size:.08,col:'#9fb8ff'});}
function sparkle(x,y){for(let i=0;i<14;i++){const a=i/14*6.283;part({x,y,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,life:.5,size:.09,col:i%2?'#ffffff':'#8ff6ff'});}}
function cpFx(c){for(let i=0;i<10;i++)part({x:c.x+(Math.random()-.5)*1.4,y:c.y+.3,vx:0,vy:2+Math.random()*3,life:.8,size:.08,col:'#7df9ff'});}
function confetti(){for(let i=0;i<80;i++){const a=Math.random()*6.283,v=3+Math.random()*8;
 part({x:P.x,y:P.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+4,grav:12,life:1.2,size:.12,
 col:['#7de8ff','#c77dff','#ff8ad8','#ffffff'][i%4],type:'frag',rot:Math.random()*3,vr:(Math.random()-.5)*10});}}

function die(){if(P.dead||P.inv>0)return;P.dead=true;P.deadT=.85;deaths++;shake=1;flash=.6;burstDeath(P.x,P.y);sfx.die();}
function respawn(){P.dead=false;P.x=cpPoint.x;P.y=cpPoint.y+1.2;P.vx=0;P.vy=0;P.inv=1.2;P.plat=null;trail.length=0;}

/* ================= 物理 ================= */
let solidsNow=[];
function buildSolids(){solidsNow.length=0;for(const s of solids)solidsNow.push(s);
 for(const m of movers)solidsNow.push({x:m.x,y:m.y,w:m.w,h:m.h,top:m.y+m.h,plat:m});}
function boxHit(s){return P.x-P.half<s.x+s.w&&P.x+P.half>s.x&&P.y-P.half<s.top&&P.y+P.half>s.y;}

function step(dt){
 time+=dt;
 for(const m of movers){const nx=m.x0+(Math.sin(time*m.spd+m.ph)*.5+.5)*m.range;m.dx=nx-m.x;m.x=nx;}
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.age+=dt;if(q.age>=q.life){particles.splice(i,1);continue;}
  q.vy-=q.grav*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;}
 for(const q of trail)q.age+=dt;
 while(trail.length&&trail[0].age>TLIFE)trail.shift();
 if(toastT>0)toastT-=dt;
 if(!started)return;
 gt+=dt;
 if(P.dead){P.deadT-=dt;if(P.deadT<=0)respawn();return;}
 buildSolids();
 if(P.plat)P.x+=P.plat.dx;
 const ph=PHYS[mode];
 const Lf=keys.ArrowLeft||keys.KeyA,Rt=keys.ArrowRight||keys.KeyD;
 const dir=(Rt?1:0)-(Lf?1:0);
 if(dir)P.face=dir;
 const spr=(keys.ShiftLeft||keys.ShiftRight)&&(dir!==0||Math.abs(P.vx)>2);
 if(spr&&!P.wasSpr)sfx.dash();
 P.wasSpr=spr;P.sprint=spr;
 const target=dir*(spr?SPRINT:RUN);
 const acc=P.grounded?(dir!==0?90:120):ph.air;
 const dv=target-P.vx,st=acc*dt;
 P.vx+=Math.abs(dv)<=st?dv:Math.sign(dv)*st;
 P.jbuf-=dt;P.coyote-=dt;
 const hold=keys.Space||keys.KeyW||keys.ArrowUp;
 if(P.jbuf>0&&(P.grounded||P.coyote>0)){P.vy=ph.JV;P.grounded=false;P.coyote=0;P.jbuf=0;P.squash=-.24;sfx.jump();}
 // 手感优化：长按升得高、飘；轻点砍高 —— 经典：恒定 g=10
 const gm=mode==='tuned'?(P.vy>0?(hold?1:2.6):(hold?1.4:2.2)):1;
 P.vy-=ph.G*gm*dt;if(P.vy<-ph.MF)P.vy=-ph.MF;
 const pv=P.vy;
 P.x+=P.vx*dt;
 for(const s of solidsNow){if(boxHit(s)){
  if(P.vx>0)P.x=s.x-P.half;else if(P.vx<0)P.x=s.x+s.w+P.half;
  else{const dl=P.x+P.half-s.x,dr=s.x+s.w-(P.x-P.half);P.x+=dl<dr?-dl:dr;}
  P.vx=0;}}
 P.x=clamp(P.x,P.half,MAP_W-P.half);
 P.y+=P.vy*dt;
 P.grounded=false;P.plat=null;
 for(const s of solidsNow){if(boxHit(s)){
  if(P.vy<=0){P.y=s.top+P.half;
   if(pv<-7.5){dust(P.x,P.y-P.half,6);sfx.land(-pv*.02);P.squash=Math.min(.42,-pv*.028);}
   P.vy=0;P.grounded=true;if(s.plat)P.plat=s.plat;}
  else{P.y=s.y-P.half;P.vy=0;}}}
 if(P.grounded)P.coyote=ph.coy;
 P.squash*=Math.exp(-7*dt);
 P.inv=Math.max(0,P.inv-dt);
 if(P.sprint)trail.push({x:P.x-P.face*.12,y:P.y,age:0});
 if(P.inv<=0&&!P.dead){
  for(const s of spikes){ // 尖刺
   if(P.x+P.half>s.x+.3&&P.x-P.half<s.x+.7&&P.y-P.half<s.y+.55&&P.y+P.half>s.y){die();break;}}
  if(!P.dead)for(const l of lasers){ // 激光栅栏
   if(laserOn(l)&&Math.abs(P.x-l.x)<.56&&P.y+P.half>l.y0+.1&&P.y-P.half<l.y0+l.len){die();break;}}
 }
 if(!P.dead&&P.y<-8)die();
 if(!P.dead){
  for(const o of orbs){if(o.got)continue;const dx=P.x-o.x,dy=P.y-o.y;
   if(dx*dx+dy*dy<1.7){o.got=true;gotN++;sparkle(o.x,o.y);sfx.orb();
    if(gotN===orbs.length){toast='✦ 全部 42 枚光球收集完成！';toastT=3;confetti();sfx.cp();}}}
  for(const c of cps){if(!c.on&&Math.abs(P.x-c.x)<1.1&&P.y<c.y+2.4&&P.y>c.y-1){
   c.on=true;cpPoint={x:c.x,y:c.y};cpFx(c);sfx.cp();}}
  const nx=P.x-NOVA.x,ny=P.y-NOVA.y;
  if(!win&&nx*nx+ny*ny<1.8){win=true;winTime=gt;sfx.win();confetti();shake=.5;}
 }
}

  ctx.fillRect(X(c.x)-1.5,Y(4)-3,3,3);}
 ctx.fillStyle='#ffd76b';
 ctx.save();ctx.translate(X(NOVA.x),Y(NOVA.y));ctx.rotate(.785);ctx.fillRect(-2.4,-2.4,4.8,4.8);ctx.restore();
 ctx.shadowColor='#fff';ctx.shadowBlur=6;ctx.fillStyle='#ffffff';
 ctx.beginPath();ctx.arc(X(P.x),Y(P.y),2.6,0,6.283);ctx.fill();ctx.shadowBlur=0;
 const cx=X(cam.x-vw/2),cy=Y(cam.y+vh/2),cw=vw*k,chh=vh*k;
 ctx.strokeStyle='#ffb3f0';ctx.lineWidth=1.4;
 ctx.shadowColor='#ff8ad8';ctx.shadowBlur=7;
 ctx.strokeRect(cx,cy,cw,chh);ctx.shadowBlur=0;
}
function drawOverlay(dt){
 if(started&&introA>0)introA=Math.max(0,introA-dt*1.1);
 if(introA<=0)return;
 ctx.globalAlpha=Math.min(1,introA);
 ctx.fillStyle='rgba(5,3,16,.62)';ctx.fillRect(0,0,VW,VH);
 ctx.textAlign='center';
 ctx.font='900 italic 64px Arial';
 ctx.fillStyle='#eaf6ff';ctx.shadowColor='#7d6bff';ctx.shadowBlur=28;
 ctx.fillText('NEON ASCENT',VW/2,VH/2-140);ctx.shadowBlur=0;
 ctx.font='600 20px "Segoe UI","Microsoft YaHei",Arial';ctx.fillStyle='#b9c8ff';
 ctx.fillText('GEOMETRY NEON RUNNER · 手感优化版',VW/2,VH/2-104);
 ctx.textAlign='left';
 ctx.font='500 16px "Segoe UI","Microsoft YaHei",Arial';
 const L=[['A / D','左右移动 · 7 m/s（SHIFT 加速 12）'],
  ['SPACE','跳跃 · 长按约 3.2 格 / 轻点约 1 格'],
  ['SHIFT','加速冲刺 · 霓虹曳光'],
  ['P','切换 手感优化 / 经典物理（g=10）'],
  ['R / M','返回出生点 / 音效开关']];
 const lx=VW/2-235;
 L.forEach((r,i)=>{const y=VH/2-58+i*30;
  ctx.textAlign='right';ctx.font='700 16px "Segoe UI","Microsoft YaHei",Arial';ctx.fillStyle='#8ff6ff';
  ctx.fillText(r[0],lx+92,y);
  ctx.textAlign='left';ctx.font='500 16px "Segoe UI","Microsoft YaHei",Arial';ctx.fillStyle='rgba(205,220,255,.9)';
  ctx.fillText(r[1],lx+112,y);});
 ctx.textAlign='center';
 ctx.font='600 18px "Segoe UI","Microsoft YaHei",Arial';ctx.fillStyle='#ffb0e8';
 ctx.fillText('收 集 42 枚 光 球 · 登 顶 寻 找 NOVA 星',VW/2,VH/2+108);
 ctx.font='600 17px "Segoe UI","Microsoft YaHei",Arial';
 ctx.fillStyle='rgba(140,246,255,'+(.55+.4*Math.sin(time*4))+')';
 ctx.fillText('— 按任意键 · 开始 —',VW/2,VH/2+152);
 ctx.textAlign='left';ctx.globalAlpha=1;
}
function render(dt){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 // 镜头：速度前瞻 + 垂直偏移 + 冲刺缩放（取自文件二）
 let tx=P.x+clamp(P.vx*.45,-7,7),ty=P.y+2.3+clamp(P.vy*.14,-3.5,3.5);
 cam.x=lerp(cam.x,tx,1-Math.exp(-5.5*dt));
 cam.y=lerp(cam.y,ty,1-Math.exp(-4.5*dt));
 const zt=(P.sprint&&!P.dead)?.92:1;zoom=lerp(zoom,zt,1-Math.exp(-4*dt));
 shake*=Math.exp(-5*dt);flash=Math.max(0,flash-dt*1.8);
 const vw=VW/(PPM*zoom),vh=VH/(PPM*zoom);
 cam.x=clamp(cam.x,vw/2,MAP_W-vw/2);cam.y=clamp(cam.y,vh/2,MAP_H-vh/2);
 SZ=PPM*zoom;SL=cam.x-vw/2+(Math.random()-.5)*shake*.5;SB=cam.y-vh/2+(Math.random()-.5)*shake*.5;
 const pulse=Math.exp(-((time*128/60)%1)*4.5);
 let gr=ctx.createLinearGradient(0,0,0,VH);
 gr.addColorStop(0,'#080517');gr.addColorStop(.5,'#120a30');gr.addColorStop(1,'#1d0f45');
 ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);
 ctx.globalCompositeOperation='lighter';
 let bg=ctx.createRadialGradient(VW/2,VH*1.05,50,VW/2,VH*1.05,VH*.95);
 bg.addColorStop(0,'rgba(120,70,255,'+(.16+.14*pulse)+')');bg.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=bg;ctx.fillRect(0,0,VW,VH);
 ctx.globalCompositeOperation='source-over';
 drawParallax();drawGrid(pulse);drawBorder();drawDecos();
 drawSolids();drawMovers();drawCheckpoints(pulse);drawSpikes();drawLasers();
 drawOrbs();drawNOVA(pulse);drawTrail();drawParticles();drawPlayer();drawHints();
 let vg=ctx.createRadialGradient(VW/2,VH/2,VH*.38,VW/2,VH/2,VH*.85);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(3,0,14,.5)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
 if(flash>0){ctx.fillStyle='rgba(255,80,160,'+(flash*.28)+')';ctx.fillRect(0,0,VW,VH);}
 if(P.dead){ctx.fillStyle='rgba(15,2,25,'+(.4*(1-P.deadT/.85))+')';ctx.fillRect(0,0,VW,VH);}
 drawHUD();drawMinimap(vw,vh);drawOverlay(dt);
}

/* ================= 主循环 ================= */
let last=performance.now(),acc=0;const FDT=1/120;
function frame(nowMs){requestAnimationFrame(frame);
 let dt=(nowMs-last)/1000;last=nowMs;if(dt>.06)dt=.06;
 acc+=dt;if(acc>.2)acc=.2;
 let n=0;while(acc>=FDT&&n<10){step(FDT);acc-=FDT;n++;}
 musicTick();render(dt);}
requestAnimationFrame(frame);
</script>
