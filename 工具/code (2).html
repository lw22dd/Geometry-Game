<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MapCreater Pro · 2D 游戏地图编辑器</title>
<style>
:root {
  --bg-deep: #060418;
  --bg-panel: #0b0822;
  --bg-panel-2: #110d2b;
  --border: #2a2350;
  --text-main: #d6e4ff;
  --text-dim: #8ca2d6;
  --text-muted: #5a6e9c;
  --accent: #6446ff;
  --accent-light: #8caaff;
  --accent-glow: rgba(140, 170, 255, 0.4);
  --cyan: #7df9ff;
  --danger: #ff5078;
  --success: #4aff8a;
  --warning: #ffb347;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  color: var(--text-main);
  -webkit-user-select: none;
  user-select: none;
  background: var(--bg-deep);
  width: 100%;
  height: 100vh;
  font: 13px 'Inter', 'Segoe UI', 'Microsoft YaHei', sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* 滚动条 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3c3a66; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #5a5698; }

/* 顶部菜单栏 */
#menu-bar {
  height: 28px;
  background: #050310;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
  flex-shrink: 0;
}
.brand {
  font-weight: 700;
  color: var(--cyan);
  margin-right: 16px;
  font-size: 13px;
  letter-spacing: 0.5px;
}
.menu-item {
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 4px;
  color: var(--text-dim);
  transition: all 0.15s;
  font-size: 12px;
}
.menu-item:hover {
  background: var(--accent);
  color: #fff;
}

/* 副工具栏 */
#sub-toolbar {
  height: 44px;
  background: var(--bg-panel);
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  gap: 4px;
  flex-shrink: 0;
}
#sub-toolbar .sep {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 6px;
}
#sub-toolbar .spacer { flex: 1; }
.tb-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 5px;
  width: 32px;
  height: 32px;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.tb-btn:hover {
  background: rgba(100, 70, 255, 0.3);
  border-color: var(--accent-light);
  color: #fff;
}
.tb-btn.active {
  background: var(--accent);
  color: #fff;
}
.tb-select {
  background: var(--bg-deep);
  color: var(--text-main);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 12px;
}

/* 主体布局 */
#main-body {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* 左侧面板 (大纲 + 资源库) */
#left-panel {
  width: 240px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.panel-section {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel-section.half { height: 50%; }
.panel-header {
  height: 28px;
  background: var(--bg-panel-2);
  display: flex;
  align-items: center;
  padding: 0 8px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  gap: 8px;
}
.search-box {
  flex: 1;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 2px 6px;
  font-size: 11px;
  border-radius: 3px;
}
.panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
}

/* 场景大纲树 */
.tree-node {
  padding: 4px 6px;
  cursor: pointer;
  border-radius: 3px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-dim);
}
.tree-node:hover { background: rgba(100, 70, 255, 0.2); color: #fff; }
.tree-node.selected { background: rgba(100, 70, 255, 0.4); color: #fff; }
.tree-parent {
  padding: 4px 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}
.tree-children { margin-left: 12px; }

/* 视口 */
#viewport {
  flex: 1;
  background: #06041a;
  position: relative;
  overflow: hidden;
}
#viewport canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* 小地图 */
#minimap-container {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 220px;
  height: 120px;
  background: rgba(6, 4, 26, 0.95);
  border: 1px solid var(--accent-light);
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#minimap {
  width: 100%;
  height: 100%;
  display: block;
}

/* 右侧属性面板 */
#right-panel {
  width: 240px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.inspector-content {
  padding: 10px;
  overflow-y: auto;
  flex: 1;
}
.field-group { margin-bottom: 12px; }
.field-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  display: block;
}
.field-input {
  width: 100%;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 3px;
  font-family: inherit;
}
.field-input:focus { border-color: var(--accent); outline: none; }
.btn-group { display: flex; gap: 6px; margin-top: 10px; }
.btn {
  flex: 1;
  background: rgba(100, 70, 255, 0.2);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 6px;
  font-size: 12px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { background: rgba(100, 70, 255, 0.5); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: rgba(255, 80, 120, 0.2); }

/* 底部状态栏 */
#status-bar {
  height: 24px;
  background: #050310;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
  gap: 16px;
  flex-shrink: 0;
}
.status-item { display: flex; align-items: center; gap: 4px; }

/* 弹窗 */
.overlay {
  z-index: 100;
  background: rgba(5, 3, 16, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0;
  left: 0;
  backdrop-filter: blur(4px);
}
.overlay.hidden { display: none; }
.modal {
  background: var(--bg-panel);
  border: 1px solid var(--accent-light);
  border-radius: 8px;
  width: 600px;
  max-width: 90vw;
  max-height: 80vh;
  padding: 20px;
  overflow: auto;
  box-shadow: 0 0 40px rgba(60, 40, 150, 0.4);
}
.modal h2 { margin-bottom: 8px; font-size: 14px; color: var(--text-main); }
.modal p { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; }
.modal textarea {
  width: 100%;
  height: 300px;
  background: #06041a;
  border: 1px solid var(--border);
  color: #e0ecff;
  padding: 10px;
  font: 500 12px Consolas, monospace;
  border-radius: 4px;
  resize: vertical;
}
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
.modal .actions button {
  background: var(--accent);
  border: none;
  color: #fff;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.modal .actions .close { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }

/* 资源库条目 */
.lib-entry {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-dim);
  transition: all 0.1s;
}
.lib-entry:hover { background: rgba(100, 70, 255, 0.2); color: #fff; }
.lib-entry.active { background: rgba(100, 70, 255, 0.4); color: #fff; }
.lib-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  font-size: 14px;
}

/* Toast 提示 */
#toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(5, 3, 16, 0.95);
  border: 1px solid var(--accent-light);
  color: var(--text-main);
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
#toast.show { opacity: 1; }
#toast.error { border-color: var(--danger); color: var(--danger); }
#toast.success { border-color: var(--success); color: var(--success); }
</style>
</head>
<body>

<div id="menu-bar">
  <span class="brand">🧊 MapCreater Pro</span>
  <div class="menu-item">文件</div>
  <div class="menu-item">编辑</div>
  <div class="menu-item">视图</div>
  <div class="menu-item">工具</div>
  <div class="menu-item">帮助</div>
</div>

<div id="sub-toolbar">
  <button class="tb-btn" data-cmd="new" title="新建">📄</button>
  <button class="tb-btn" data-cmd="open" title="打开">📂</button>
  <button class="tb-btn" data-cmd="save" title="保存 Ctrl+S">💾</button>
  <div class="sep"></div>
  <button class="tb-btn" data-cmd="undo" title="撤销 Ctrl+Z">↩</button>
  <button class="tb-btn" data-cmd="redo" title="重做 Ctrl+Shift+Z">↪</button>
  <div class="sep"></div>
  <button class="tb-btn" data-cmd="copy" title="复制 Ctrl+C">📋</button>
  <button class="tb-btn" data-cmd="paste" title="粘贴 Ctrl+V">📌</button>
  <button class="tb-btn" data-cmd="duplicate" title="克隆 Ctrl+D">⚡</button>
  <button class="tb-btn" data-cmd="delete" title="删除 Del">🗑</button>
  <div class="sep"></div>
  <span style="font-size:12px;color:var(--text-muted)">吸附:</span>
  <select class="tb-select" id="snapSelect">
    <option value="0.1">0.1</option>
    <option value="0.5" selected>0.5</option>
    <option value="1">1</option>
  </select>
  <span style="font-size:12px;color:var(--text-muted);margin-left:8px">旋转步:</span>
  <select class="tb-select" id="rotSnapSelect">
    <option value="5">5°</option>
    <option value="15" selected>15°</option>
    <option value="45">45°</option>
  </select>
  <div class="spacer"></div>
  <button class="tb-btn" data-cmd="import-game" title="从游戏导入">🎮</button>
  <button class="tb-btn" data-cmd="export" title="导出（含校验）">📤</button>
</div>

<div id="main-body">
  <aside id="left-panel">
    <div class="panel-section half">
      <div class="panel-header">场景大纲 <input type="text" class="search-box" id="outlinerSearch" placeholder="搜索对象..."></div>
      <div class="panel-content" id="outliner"></div>
    </div>
    <div class="panel-section half">
      <div class="panel-header">资源库 <input type="text" class="search-box" id="paletteSearch" placeholder="搜索对象..."></div>
      <div class="panel-content" id="palette"></div>
    </div>
  </aside>

  <main id="viewport">
    <canvas id="c"></canvas>
    <div id="minimap-container">
      <canvas id="minimap"></canvas>
    </div>
  </main>

  <aside id="right-panel">
    <div class="panel-header">属性面板</div>
    <div class="inspector-content" id="inspectorInner"></div>
  </aside>
</div>

<div id="status-bar">
  <span class="status-item" id="statusInfo">就绪</span>
  <span class="status-item" id="statusMouse">X: 0.0, Y: 0.0</span>
  <span class="status-item" id="statusZoom">缩放: 100%</span>
  <div class="spacer" style="flex:1"></div>
  <span class="status-item" id="statusObjCount">对象: 0</span>
</div>

<div id="exportOverlay" class="overlay hidden" onclick="if(event.target===this)hideExport()">
  <div class="modal">
    <h2>📤 导出地图数据</h2>
    <p>导出前已进行地图合法性校验。点击复制代码或下载文件。</p>
    <textarea id="exportCode" readonly></textarea>
    <div class="actions">
      <button class="close" onclick="hideExport()">关闭</button>
      <button onclick="downloadExport()">💾 下载 JSON</button>
      <button onclick="copyExport()">📋 复制代码</button>
    </div>
  </div>
</div>

<div id="importOverlay" class="overlay hidden" onclick="if(event.target===this)hideImport()">
  <div class="modal" style="width:450px">
    <h2>🎮 从游戏导入</h2>
    <p>选择游戏内置地图进行逆向编辑：</p>
    <div id="importList"></div>
    <div class="actions"><button class="close" onclick="hideImport()">关闭</button></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none">
<div id="toast"></div>

<script>

function h(e) {

  p.innerHTML = '';
  let filter = (document.getElementById('paletteSearch')?.value || '').toLowerCase();
  
  let cats = new Map();
  for (let item of O) {
    if (!item.name.toLowerCase().includes(filter) && !item.type.toLowerCase().includes(filter)) continue;
    if (!cats.has(item.category)) cats.set(item.category, []);
    cats.get(item.category).push(item);
  }
  
  for (let [cat, items] of cats) {
    let catDiv = document.createElement('div');
    catDiv.innerHTML = `<div style="color:var(--text-muted);font-size:10px;margin:4px 0;text-transform:uppercase;letter-spacing:1px">${cat}</div>`;
    for (let item of items) {
      let entry = document.createElement('div'); entry.className = 'lib-entry';
      if (Y.objTool === item.toolId) entry.classList.add('active');
      entry.innerHTML = `<div class="lib-icon" style="background:${item.swatch}33;color:${item.swatch}">${item.icon}</div><span>${item.name}</span>`;
      entry.onclick = () => { Y.setMode('objects'); Y.setObjTool(Y.objTool === item.toolId ? null : item.toolId); renderPalette(); };
      catDiv.appendChild(entry);
    }
    p.appendChild(catDiv);
  }
  
  // 几何工具
  let geomDiv = document.createElement('div');
  geomDiv.innerHTML = `<div style="color:var(--text-muted);font-size:10px;margin:4px 0;text-transform:uppercase;letter-spacing:1px">几何工具</div>`;
  let rectEntry = document.createElement('div'); rectEntry.className = 'lib-entry';
  if (Y.mode === 'geometry' && Y.geomTool === 'rect') rectEntry.classList.add('active');
  rectEntry.innerHTML = `<div class="lib-icon" style="background:rgba(110,200,255,.15);color:#8ff6ff">▭</div><span>矩形画笔</span>`;
  rectEntry.onclick = () => { Y.setMode('geometry'); Y.setGeomTool('rect'); renderPalette(); };
  geomDiv.appendChild(rectEntry);
  p.appendChild(geomDiv);
}

// ==========================================
// 地图校验
// ==========================================
function validateMap() {
  let errors = [], warnings = [];
  if (!Y.map.name) errors.push("缺少地图名称");
  if (!Y.map.id) errors.push("缺少地图 ID");
  if (!Y.map.playerSpawn) errors.push("缺少玩家出生点");
  
  Y.map.layers.objects.forEach((o, i) => {
    let p = ne(o);
    if (p.x < 0 || p.x > Y.map.width) errors.push(`对象 #${i + 1} (${o.type}) 超出水平边界`);
    if (p.y < 0 || p.y > Y.map.height) errors.push(`对象 #${i + 1} (${o.type}) 超出垂直边界`);
  });
  
  if (Y.map.layers.geometry.length === 0) warnings.push("地图中没有几何体");
  if (Y.map.layers.objects.length === 0) warnings.push("地图中没有场景对象");
  
  // 检查是否有NOVA终点
  if (!Y.map.layers.objects.some(o => o.type === 'nova')) warnings.push("地图中缺少 NOVA 终点");
  
  return { errors, warnings };
}

  let t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
  setTimeout(() => { t.className = ''; }, 2500);
}

// 鼠标交互
var X = { kind: 'none', button: 0, sx: 0, sy: 0, wx: 0, wy: 0, ax: 0, ay: 0, target: null }, Z = 0, Q = 0;
function getMouse(t) {
  let i = e.getBoundingClientRect();
  return [(t.clientX - i.left) * (n / i.width), (t.clientY - i.top) * (r / i.height)];
}

e.addEventListener('mousedown', ev => {
  let [tx, ty] = getMouse(ev), pos = l(tx, ty);
  X.button = ev.button; X.sx = tx; X.sy = ty; X.wx = pos.x; X.wy = pos.y; X.ax = pos.x; X.ay = pos.y; X.target = null;
  if (ev.button === 0) {
    if (Math.abs(pos.x - Y.map.playerSpawn.x) < 1.5 && Math.abs(pos.y - Y.map.playerSpawn.y) < 1.5) {
      Y.selectSpawn(); X.kind = 'move'; X.target = { layer: 'spawn' }; return;
    }
    if (Y.mode === 'objects' && Y.objTool) {
      let def = k(Y.objTool);
      if (def) {
        let snapX = p(pos.x, Y.snap), snapY = p(pos.y, Y.snap);
        let obj = def.defaults();
        if (obj.type === 'mover') obj.x0 = snapX; else if (obj.type === 'laser') { obj.x = snapX; obj.y0 = snapY; } else { obj.x = snapX; obj.y = snapY; }
        Y.addInstance(obj);
        if (!Y.lockPlace) { Y.setObjTool(null); renderPalette(); }
        return;
      }
    }
    // 选择对象
    for (let i = Y.map.layers.objects.length - 1; i >= 0; i--) {
      if (ae(Y.map.layers.objects[i], pos.x, pos.y)) { Y.select({ layer: 'objects', index: i }); X.kind = 'move'; X.target = { layer: 'objects', index: i }; return; }
    }
    for (let i = Y.map.layers.geometry.length - 1; i >= 0; i--) {
      if (b(Y.map.layers.geometry[i], pos.x, pos.y)) { Y.select({ layer: 'geometry', index: i }); X.kind = 'move'; X.target = { layer: 'geometry', index: i }; return; }
    }
    // 空白处绘制矩形
    if (Y.mode === 'geometry') { X.kind = 'draw-rect'; Y.clearSelection(); return; }
    Y.clearSelection(); X.kind = 'pan';
  }
});

e.addEventListener('mousemove', ev => {
  let [tx, ty] = getMouse(ev), pos = l(tx, ty);
  Z = pos.x; Q = pos.y;
  document.getElementById('statusMouse').textContent = `X: ${pos.x.toFixed(1)}, Y: ${pos.y.toFixed(1)}`;
  
  if (X.button === 2) { f(tx - X.sx, ty - X.sy); X.sx = tx; X.sy = ty; return; }
  if (X.button !== 0) return;
  
  let dx = pos.x - X.wx, dy = pos.y - X.wy;
  
  if (X.kind === 'move') {
    if (Math.abs(tx - X.sx) < 3 && Math.abs(ty - X.sy) < 3) return;
    X.wx = pos.x; X.wy = pos.y;
    if (X.target?.layer === 'spawn') Y.moveSpawn(dx, dy);
    else if (X.target) {
      Y.moveSelected(dx, dy);
      // 智能参考线检查
      let obj = X.target.layer === 'geometry' ? Y.map.layers.geometry[X.target.index] : Y.map.layers.objects[X.target.index];
      if (obj) checkSmartGuides(obj);
    }
  } else if (X.kind === 'draw-rect') {
    X.wx = pos.x; X.wy = pos.y;
  } else if (X.kind === 'pan') {
    f(tx - X.sx, ty - X.sy); X.sx = tx; X.sy = ty;
  }
});

e.addEventListener('mouseup', ev => {
  if (ev.button !== 0) return;
  let [tx, ty] = getMouse(ev), pos = l(tx, ty);
  
  if (X.kind === 'draw-rect' && (Math.abs(tx - X.sx) > 3 || Math.abs(ty - X.sy) > 3)) {
    let x1 = p(Math.min(X.ax, pos.x), Y.snap), y1 = p(Math.min(X.ay, pos.y), Y.snap);
    let x2 = p(Math.max(X.ax, pos.x), Y.snap), y2 = p(Math.max(X.ay, pos.y), Y.snap);
    Y.addRect(x1, y1, Math.max(.1, x2 - x1), Math.max(.1, y2 - y1));
  }
  if (X.kind === 'move') { Y.commitMove(); activeGuides = []; }
  X.kind = 'none'; X.button = -1;
});

// 快捷键
document.addEventListener('keydown', ev => {
  if (document.activeElement?.tagName === 'INPUT') return;
  
  if (ev.ctrlKey && ev.key === 'z') { Y.undo(); ev.preventDefault(); return; }
  if (ev.ctrlKey && ev.shiftKey && (ev.key === 'Z' || ev.key === 'z')) { Y.redo(); ev.preventDefault(); return; }
  if (ev.ctrlKey && ev.key === 'y') { Y.redo(); ev.preventDefault(); return; }
  if (ev.ctrlKey && ev.key === 's') { saveMap(); ev.preventDefault(); return; }
  if (ev.ctrlKey && ev.key === 'c') { Y.copyToClipboard(); showToast("已复制到剪贴板", "success"); ev.preventDefault(); return; }
  if (ev.ctrlKey && ev.key === 'v') { if (Y.pasteFromClipboard()) showToast("已粘贴", "success"); ev.preventDefault(); return; }
  if (ev.ctrlKey && ev.key === 'd') { Y.duplicateSelected(); ev.preventDefault(); return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace') { Y.removeSelected(); ev.preventDefault(); return; }
  if (ev.key === 'Escape') { Y.clearSelection(); renderPalette(); }
});

function saveMap() {
  let data = JSON.stringify(Y.mapSnapshot(), null, 2);
  let blob = new Blob([data], { type: 'application/json' });
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a'); a.href = url; a.download = `${Y.map.id}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast("保存成功", "success");
}

function validateAndExport() {
  let { errors, warnings } = validateMap();
  if (errors.length > 0) {
    showToast(`校验失败: ${errors[0]}`, "error");
    if (!confirm("地图存在错误:\n\n" + errors.join("\n") + "\n\n是否仍然导出？")) return;
  } else if (warnings.length > 0) {
    showToast(`校验通过 (${warnings.length} 个警告)`, "info");
  } else {
    showToast("校验通过，地图完全合法", "success");
  }
  document.getElementById('exportCode').value = JSON.stringify(Y.mapSnapshot(), null, 2);
  document.getElementById('exportOverlay').classList.remove('hidden');
}

  document.getElementById('importOverlay').classList.remove('hidden');

    btn.onclick = () => { Y.loadMap(m.data); u(Y.map.playerSpawn.x, Y.map.playerSpawn.y, .45); document.getElementById('importOverlay').classList.add('hidden'); };
    list.appendChild(btn);
  });
}

// 渲染循环
var lastTime = 0;
function loop(time) {
  requestAnimationFrame(loop);
  let dt = (time - lastTime) / 1000; lastTime = time;
  
  // 自适应尺寸
  let parent = e.parentElement;
  if (parent.clientWidth !== n || parent.clientHeight !== r) {
    a(); let cx = o.SL + n / (2 * o.SZ), cy = o.SB + r / (2 * o.SZ);
    o.SL = cx - n / (2 * o.SZ); o.SB = cy - r / (2 * o.SZ);
  }
  
  t.setTransform(i, 0, 0, i, 0, 0);
  let grad = t.createLinearGradient(0, 0, 0, r);
  grad.addColorStop(0, '#080517'); grad.addColorStop(.5, '#120a30'); grad.addColorStop(1, '#1d0f45');
  t.fillStyle = grad; t.fillRect(0, 0, n, r);
  
  drawGrid();
  drawBounds(Y);
  drawSpawn(Y);
  
  Y.map.layers.geometry.forEach(drawGeom);
  Y.map.layers.objects.forEach(o => drawObj(o, time / 1000));
  
  if (X.kind === 'draw-rect') {
    let x1 = Math.min(X.ax, Z), y1 = Math.min(X.ay, Q);
    let w = Math.abs(Z - X.ax), h = Math.abs(Q - X.ay);
    t.save(); t.strokeStyle = 'rgba(143, 246, 255, 0.8)'; t.lineWidth = 1.5; t.setLineDash([4, 4]);
    t.strokeRect(s(x1), c(y1 + h), w * o.SZ, h * o.SZ);
    t.restore(); t.setLineDash([]);
  }
  
  drawSelection(Y);
  drawSmartGuides();
  drawMinimap();
}
requestAnimationFrame(loop);
